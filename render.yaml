services:
  - type: web
    name: aureven-flow
    runtime: docker
    plan: starter # Starter plan recommended for FFmpeg / video merging (512MB-1GB RAM)
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MAX_CONCURRENT_DOWNLOADS
        value: "2"
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: ANALYZE_RATE_LIMIT
        value: "30"
      - key: DOWNLOAD_RATE_LIMIT
        value: "20"
      - key: ANALYZE_TIMEOUT_MS
        value: "120000"
      - key: DOWNLOAD_TIMEOUT_MS
        value: "1800000"
      - key: PROCESS_TIMEOUT_MS
        value: "1800000"
      - key: TEMP_DIR
        value: /tmp/aureven-flow
